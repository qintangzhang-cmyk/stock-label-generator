name: Fetch Quotes

on:
  # GitHub 排程任務無 SLA，實測穩定延遲 ~2 小時（07:30 HKT 計劃 → 09:30 HKT 才跑）。
  # 為了讓門店 07:30 開門前能拿到當天數據，把計劃時間提前 2 小時：
  #   主排程 21:30 UTC = 05:30 HKT 計劃 → 實際 ~07:30 HKT 落地
  #   備援 22:30 UTC = 06:30 HKT 計劃 → 實際 ~08:30 HKT（主排程被跳過時兜底）
  # 同一份 quotes.json 被多次刷新沒問題：commit step 的 git diff 自動 no-op。
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # API Key 認證（用戶中心的 App Key / App Secret / Access Token，純字符串，
      # 90 天有效）。取代舊的 longbridge CLI + 瀏覽器 OAuth + 加密 token 輪換 ——
      # 那套每 ~2 週就因 token 解密/刷新失敗而掛。
      LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
      LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
      LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
      # 關掉 SDK 啟動時打印的行情包橫幅，否則會污染 quotes.json（stdout 重定向）
      LONGBRIDGE_PRINT_QUOTE_PACKAGES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Longbridge SDK
        run: pip install --quiet longbridge

      - name: Build quotes.json
        run: |
          if [ -z "$LONGBRIDGE_APP_KEY" ] || [ -z "$LONGBRIDGE_ACCESS_TOKEN" ]; then
            echo "::error::Missing LONGBRIDGE_APP_KEY / LONGBRIDGE_APP_SECRET / LONGBRIDGE_ACCESS_TOKEN secret"
            exit 1
          fi
          # stderr 同时留一份到文件:失败时把真实报错(含長橋 error code)写进告警,
          # 别再让人对着"可能原因"猜。
          set +e
          python3 scripts/build_quotes.py > quotes.json 2>/tmp/build_err.txt
          RC=$?
          set -e
          cat /tmp/build_err.txt >&2 || true
          if [ $RC -ne 0 ]; then exit $RC; fi
          COUNT=$(python3 -c 'import json,sys; print(json.load(open("quotes.json"))["count"])')
          echo "::notice::Fetched $COUNT symbols"
          # 留个标记:抓取这步是过了的。失败若发生在后面的续期/提交步骤,
          # 诊断就不该再往 token 上引(2026-09-07 那次的教训是别给错方向)。
          touch /tmp/build_ok

      # 自動續期：access token 是 90 天 JWT。剩餘 <30 天時自動換新（再 90 天），
      # 新 token 直接寫回 Secret（純字符串、無損，舊機制的二進制/解密問題不復存在）。
      # ROTATE_PAT 未配時只是不續期；token 還有幾十天，到期會由告警提醒人工更新。
      - name: Refresh access token if near expiry
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
          REPO: ${{ github.repository }}
          REFRESH_THRESHOLD_DAYS: '30'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ROTATE_PAT 未配置 — 跳過自動續期"
            exit 0
          fi
          STATUS=$(python3 scripts/refresh_token_if_needed.py /tmp/new_token)
          echo "refresh status: $STATUS"
          if [ "$STATUS" = "REFRESHED" ]; then
            gh secret set LONGBRIDGE_ACCESS_TOKEN -R "$REPO" < /tmp/new_token
            rm -f /tmp/new_token
            echo "✓ Access token 已續期並寫回 Secret（再 90 天）"
          fi

      - name: Commit quotes.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes in quotes.json"
          else
            git commit -m "chore(data): refresh quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 失敗告警：開/更新一個 auto-alert issue（@清汤，觸發郵件），成功時自動關閉。
      # 失敗時先判斷 token 是"過期"還是"被吊銷"——兩者處理方式不同,而續期步驟
      # 只在成功路徑跑(if: success()),失敗時拿不到這個數,2026-09-07 就因此誤判了一輪。
      - name: Diagnose token state
        if: failure()
        id: diag
        continue-on-error: true      # 诊断步骤自己挂掉不该连累后面的告警
        run: |
          if [ -f scripts/token_days_left.py ]; then
            DAYS=$(python3 scripts/token_days_left.py || echo "unknown")
          else
            DAYS="script-missing"
          fi
          echo "access token days left: $DAYS"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"

          if [ -f /tmp/build_ok ]; then
            STAGE="行情抓取已成功，失败发生在之后的步骤（续期 / 提交），与 token 无关"
            ERR_TXT="(抓取步骤本身没有报错，请直接看 run 日志定位失败的步骤)"
          elif [ -s /tmp/build_err.txt ]; then
            STAGE="行情抓取步骤失败"
            ERR_TXT=$(tail -n 6 /tmp/build_err.txt | tr -d '\r')
          else
            STAGE="失败发生在行情抓取之前（依赖安装 / checkout / secret 缺失）"
            ERR_TXT="(没有捕获到 stderr)"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

          # 仓库是 public，issue 正文走 API、不受 Actions 的 secret 打码保护，
          # 所以第三方 stderr 写出去之前自己擦一遍。
          for S in "$LONGBRIDGE_ACCESS_TOKEN" "$LONGBRIDGE_APP_SECRET" "$LONGBRIDGE_APP_KEY"; do
            [ -n "$S" ] && ERR_TXT=${ERR_TXT//"$S"/'***'}
          done
          # 随机分隔符 + printf 补尾换行:内容不带换行或恰好含分隔符时都不会写坏
          D="ERR_$(openssl rand -hex 8)"
          {
            echo "err<<$D"
            printf '%s\n' "$ERR_TXT"
            echo "$D"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DAYS: ${{ steps.diag.outputs.days }}
          ERR: ${{ steps.diag.outputs.err }}
          STAGE: ${{ steps.diag.outputs.stage }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          BODY="**Run #${RUN_ID} 失敗** — [查看日志](${RUN_URL})

          咖啡店股票標籤的行情數據沒拉到，標籤頁會停在上一次成功的數據。

          ---

          **失敗環節**：${STAGE}

          ### 實際報錯

          \`\`\`
          ${ERR}
          \`\`\`

          ### Access token 剩餘有效期：**${DAYS} 天**

          照這個數字判斷，別再猜：

          | 剩餘天數 | 說明 | 怎麼處理 |
          |---|---|---|
          | **> 0，但報 401004 / token invalid** | token 沒過期，是被**服務端吊銷**了（多半是有人在用戶中心重新生成過 token、改過密碼，或帳戶權限變動）。自動續期沒有問題，不用查它 | 去用戶中心重新生成 Access Token，更新 secret（見下） |
          | **<= 0** | token 真的過期了，自動續期沒跑成功 | 同樣重新生成 token；另外查 \`ROTATE_PAT\` 是否還有效、續期步驟近幾次的 log |
          | **unknown** | token 為空或 JWT 解不開，secret 可能被寫壞 | 重新寫一次 secret |
          | **script-missing** | 診斷腳本沒進倉庫（不是 token 的問題） | 補上 \`scripts/token_days_left.py\` |
          | 報錯不含 token 字樣 | 多半是長橋 API 故障或行情權限變動，與 token 無關 | 先確認長橋行情服務是否正常，再看帳戶的行情權限 |

          ### 重新生成後

          \`\`\`bash
          gh secret set LONGBRIDGE_ACCESS_TOKEN -R ${REPO} --body '<用戶中心的新 Access Token>'
          gh workflow run \"Fetch Quotes\" -R ${REPO}
          \`\`\`

          修好後此 issue 會在下次成功運行時自動關閉。"
          EXISTING=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "$BODY"
          else
            gh label create "auto-alert" -R "$REPO" --color "d73a4a" --description "Auto-created by workflows" 2>/dev/null || true
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "auto-alert" --assignee qintangzhang-cmyk
          fi

      # 同時發郵件到外部相關人（GitHub 內建通知到不了外部郵箱，靠 Gmail SMTP）。
      # MAIL_* 未配時 send_alert_email.py 靜默跳過，不影響上面的 issue 告警。
      - name: Email alert on failure
        if: failure()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAILS: 'cody.fung@longbridge.hk,timmy@chcatcreative.com'
          ALERT_SUBJECT: '🔴 咖啡店股票標籤：行情數據抓取失敗'
          ALERT_BODY: |
            Fetch Quotes 工作流失敗，咖啡店股票標籤的行情數據沒拉到。
            連續失敗會導致 cafe 標籤頁顯示舊數據。

            日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            失敗環節：${{ steps.diag.outputs.stage }}
            Access token 剩餘有效期：${{ steps.diag.outputs.days }} 天

            具體原因和處理步驟見倉庫 issue（裡面有真實報錯和判斷表），
            不要直接假設是 token 過期 —— 剩餘天數大於 0 卻報 token invalid，
            說明是被吊銷而不是到期。
            （此郵件由 GitHub Actions 自動發送）
        run: python3 scripts/send_alert_email.py

      - name: Close failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          EXISTING=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" -R "$REPO" --comment "✅ 已自動恢復 — [Run #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})"
          fi
