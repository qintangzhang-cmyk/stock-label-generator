name: Fetch Quotes

on:
  # GitHub 排程任務無 SLA，實測穩定延遲 ~2 小時（07:30 HKT 計劃 → 09:30 HKT 才跑）。
  # 為了讓門店 07:30 開門前能拿到當天數據，把計劃時間提前 2 小時：
  #   主排程 21:30 UTC = 05:30 HKT 計劃 → 實際 ~07:30 HKT 落地
  #   備援 22:30 UTC = 06:30 HKT 計劃 → 實際 ~08:30 HKT（主排程被跳過時兜底）
  # 同一份 quotes.json 被多次刷新沒問題：commit step 的 git diff 自動 no-op。
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  # Actions 页面支持手动点 "Run workflow"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PIN the CLI version. The official install script always pulls latest,
      # which bit us twice: v0.23.1 (2026-06-10) dropped legacy JSON token-path
      # support and every scheduled run broke overnight. v0.23.0 is the last
      # version that auto-migrates ~/.longbridge/openapi/tokens/<client_id>.
      # To upgrade deliberately: bump LB_VERSION, run workflow_dispatch, watch it.
      - name: Install Longbridge CLI (pinned)
        env:
          LB_VERSION: v0.23.0
        run: |
          curl -sSL -o /tmp/lb.tar.gz \
            "https://github.com/longbridge/longbridge-terminal/releases/download/${LB_VERSION}/longbridge-terminal-linux-musl-amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/lb.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/longbridge"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/longbridge" --version

      - name: Restore OAuth token
        env:
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
          LB_TOKEN_JSON: ${{ secrets.LONGBRIDGE_TOKEN_JSON }}
        run: |
          if [ -z "$LB_CLIENT_ID" ] || [ -z "$LB_TOKEN_JSON" ]; then
            echo "::error::Missing LONGBRIDGE_CLIENT_ID or LONGBRIDGE_TOKEN_JSON secret"
            exit 1
          fi
          # Secret stores raw JSON (old CLI format). New CLI (0.23+) auto-migrates
          # from this legacy path to ~/.longbridge/openapi/cli-auth (binary format)
          # on first read, so this single write works for any CLI version.
          mkdir -p ~/.longbridge/openapi/tokens
          printf '%s' "$LB_TOKEN_JSON" > "$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID"

      - name: Build quotes.json
        run: |
          python3 scripts/build_quotes.py > quotes.json
          COUNT=$(python3 -c 'import json; print(json.load(open("quotes.json"))["count"])')
          echo "::notice::Fetched $COUNT symbols"

      # Token rotation: only rotate if a CLI version that uses JSON file format is in use.
      # Newer CLI (0.23+) uses a BINARY cli-auth file that cannot survive being stored
      # in a GitHub Secret (binary content breaks env var interpolation at job startup).
      # We only push back if we find a valid JSON-shaped token file at the legacy path.
      # If only cli-auth exists, we skip rotation — user does manual `longbridge login`
      # when the alert issue fires.
      - name: Rotate LONGBRIDGE_TOKEN_JSON secret (JSON tokens only)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ROTATE_PAT not configured — skipping rotation"
            exit 0
          fi
          LEGACY="$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID"
          CLI_AUTH="$HOME/.longbridge/openapi/cli-auth"
          if [ -f "$LEGACY" ]; then
            # Sanity check: file must start with '{' (JSON object) and contain no null bytes
            FIRST_CHAR=$(head -c 1 "$LEGACY")
            if [ "$FIRST_CHAR" = "{" ] && ! grep -q $'\0' "$LEGACY" 2>/dev/null; then
              echo "Rotating LONGBRIDGE_TOKEN_JSON from $LEGACY ($(wc -c < "$LEGACY") bytes)"
              gh secret set LONGBRIDGE_TOKEN_JSON -R "$REPO" < "$LEGACY"
              echo "✓ Secret updated"
              exit 0
            else
              echo "::warning::Legacy token file exists but isn't valid JSON — skipping rotation"
            fi
          fi
          if [ -f "$CLI_AUTH" ]; then
            echo "::notice::CLI is using binary cli-auth format ($(wc -c < "$CLI_AUTH") bytes), which cannot be safely stored as a GitHub Secret (binary breaks env-var interpolation at job startup). Skipping auto-rotation. When refresh token expires, run \`longbridge login\` locally and \`gh secret set LONGBRIDGE_TOKEN_JSON -R $REPO < ~/.longbridge/openapi/tokens/$LB_CLIENT_ID\`."
            exit 0
          fi
          echo "::warning::No token file found at either path — nothing to rotate"

      - name: Commit quotes.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes in quotes.json"
          else
            git commit -m "chore(data): refresh quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Failure alerting via GitHub Issue:
      # - On failure: open a canonical "Fetch Quotes failing" issue, or add a
      #   comment if one already exists. Repo owner gets notified via GitHub's
      #   normal channels (email + mobile push) for free.
      # - On next success: auto-close the issue so we don't carry old noise.
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          BODY=$(cat <<EOF
          **Run #${RUN_ID} 失敗** — [查看 GitHub Actions 日志](${RUN_URL})

          咖啡店股票標籤的行情數據沒拉到。如果連續失敗，標籤會繼續顯示舊數據。

          ---

          **最常見原因：長橋 refresh token 過期。**

          修復三步：

          \`\`\`bash
          # 1. 本地重新走 OAuth
          longbridge login

          # 2. 把新 token 推到 GitHub Secret
          gh secret set LONGBRIDGE_TOKEN_JSON \\
            -R ${REPO} \\
            < ~/.longbridge/openapi/tokens/<CLIENT_ID>

          # 3. 手動觸發一次工作流確認修好
          gh workflow run "Fetch Quotes" -R ${REPO}
          \`\`\`

          修好後此 issue 會在下次成功運行時自動關閉。
          EOF
          )
          existing=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$existing" ]; then
            echo "Updating existing alert issue #$existing"
            gh issue comment "$existing" -R "$REPO" --body "$BODY"
          else
            echo "Creating new alert issue"
            gh label create "auto-alert" -R "$REPO" --color "d73a4a" --description "Auto-created by workflows" 2>/dev/null || true
            # --assignee 觸發單獨的 "@you was assigned" 通知，比 ci_activity 等級高，
            # GitHub 默認會發郵件，不會被 Watching 設置吞掉
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "auto-alert" --assignee qintangzhang-cmyk
          fi

      - name: Close failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          existing=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$existing" ]; then
            echo "Closing recovered issue #$existing"
            gh issue close "$existing" -R "$REPO" --comment "✅ 已自動恢復 — [Run #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})"
          fi
