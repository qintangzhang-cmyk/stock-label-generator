name: Fetch Quotes

on:
  # GitHub scheduled runs start late (median ~3h in Oct 2026, up to 5h+), so
  # scheduling "early and hoping" kept landing data at 08:00–10:00 HKT.
  # Instead the runs start *before* the US close and scripts/fetch_gate.py
  # waits for 16:15 New York time, then fetches. New York time handles the
  # EDT/EST switch automatically (ready = 20:15 UTC summer, 21:15 UTC winter).
  # Several start times give redundancy; the concurrency group runs them one
  # at a time and the gate makes later ones skip once today's data exists.
  schedule:
    - cron: '17 18 * * *'
    - cron: '47 19 * * *'
    - cron: '17 21 * * *'
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Fetch now even if today''s data already exists'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Long enough to wait for the US close when GitHub starts the job early.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Pinned: an unpinned upgrade broke the feed once (2026-06-11).
      - name: Install Longbridge SDK
        run: pip install --quiet 'longbridge==5.3.0'

      - name: Wait for the US close
        if: github.event_name == 'schedule'
        run: python3 scripts/fetch_gate.py wait

      - name: Decide whether to fetch
        id: gate
        run: |
          git pull --ff-only --quiet
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          echo "action=$(python3 scripts/fetch_gate.py decide quotes.json $FORCE)" >> "$GITHUB_OUTPUT"

      # The Longbridge credentials are only exposed to this one step.
      - name: Build quotes.json
        id: build
        if: steps.gate.outputs.action == 'fetch'
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_PRINT_QUOTE_PACKAGES: 'false'
        run: |
          if [ -z "$LONGBRIDGE_APP_KEY" ] || [ -z "$LONGBRIDGE_APP_SECRET" ] || [ -z "$LONGBRIDGE_ACCESS_TOKEN" ]; then
            echo "reason=missing_secret" >> "$GITHUB_OUTPUT"
            echo "::error::Missing LONGBRIDGE_APP_KEY / LONGBRIDGE_APP_SECRET / LONGBRIDGE_ACCESS_TOKEN secret"
            exit 1
          fi
          set +e
          python3 scripts/build_quotes.py quotes.json
          RC=$?
          set -e
          case "$RC" in
            0) echo "reason=ok" >> "$GITHUB_OUTPUT" ;;
            3) echo "reason=token" >> "$GITHUB_OUTPUT" ;;
            4) echo "reason=missing_symbols" >> "$GITHUB_OUTPUT" ;;
            *) echo "reason=other" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$RC"

      # The `if:` has no status function, so success() is implied: this only
      # runs when the build succeeded, and a failed fetch never overwrites good
      # data (build_quotes.py also refuses to write an incomplete file).
      - name: Commit quotes.json
        id: commit
        if: steps.gate.outputs.action == 'fetch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes in quotes.json"
            exit 0
          fi
          git commit -m "chore(data): refresh quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 10
          done
          echo "::error::Could not push quotes.json after 3 attempts"
          exit 1

      # Failure alert: open/update an auto-alert issue (@清汤) with the actual cause.
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REASON: ${{ steps.build.outputs.reason }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          SECRET_URL="https://github.com/${REPO}/settings/secrets/actions"
          RERUN_URL="https://github.com/${REPO}/actions/workflows/fetch-quotes.yml"
          case "$REASON" in
            token)
              WHY="長橋拒絕了 token（401）。最常見原因：有人在長橋用戶中心**重新生成了 token**，舊的立即作廢（2026-09-08、09-11 都是這樣）。"
              FIX="1. 到長橋用戶中心取得目前有效的 Access Token
          2. 打開 [Secrets 設置頁](${SECRET_URL})，更新 \`LONGBRIDGE_ACCESS_TOKEN\`（App Key / Secret 換過的話也一併更新）
          3. 打開 [Fetch Quotes 頁面](${RERUN_URL})，點 Run workflow，勾選 force 後運行" ;;
            missing_secret)
              WHY="GitHub 裡缺少長橋的 App Key / Secret / Token。"
              FIX="打開 [Secrets 設置頁](${SECRET_URL}) 補上三個 \`LONGBRIDGE_*\`，再到 [Fetch Quotes 頁面](${RERUN_URL}) 手動運行。" ;;
            missing_symbols)
              WHY="抓到了行情，但美股七巨頭或 SPY 缺失／價格為 0，為避免印出殘缺貼紙，**這次沒有覆蓋** quotes.json（門店仍看到上一份數據）。"
              FIX="多半是長橋行情暫時異常，稍後到 [Fetch Quotes 頁面](${RERUN_URL}) 手動運行一次即可。連續出現請查看日志。" ;;
            *)
              if [ "$COMMIT_OUTCOME" = "failure" ]; then
                WHY="行情已抓好，但推送 quotes.json 時衝突或失敗（與 token 無關）。"
                FIX="到 [Fetch Quotes 頁面](${RERUN_URL}) 勾選 force 再運行一次。"
              else
                WHY="抓取過程出現其他錯誤（不是 token 被拒）。"
                FIX="查看 [日志](${RUN_URL}) 中 \`fetch failed:\` 那一行；長橋接口偶發錯誤的話，到 [Fetch Quotes 頁面](${RERUN_URL}) 再運行一次。"
              fi ;;
          esac
          BODY="**Run #${RUN_ID} 失敗** — [查看日志](${RUN_URL})

          **原因**：${WHY}

          **處理**：
          ${FIX}

          修好後此 issue 會在下次成功運行時自動關閉。"
          EXISTING=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "$BODY"
          else
            gh label create "auto-alert" -R "$REPO" --color "d73a4a" --description "Auto-created by workflows" 2>/dev/null || true
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "auto-alert" --assignee qintangzhang-cmyk
          fi

      # Best-effort: Gmail has been rejecting the app password (SMTP 535) in
      # recent runs, so this must not mask the real failure. Fix MAIL_PASSWORD to revive.
      - name: Email alert on failure
        if: failure()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAILS: 'cody.fung@longbridge.hk,timmy@chcatcreative.com'
          ALERT_SUBJECT: '🔴 咖啡店股票標籤：行情數據抓取失敗'
          ALERT_BODY: |
            Fetch Quotes 工作流失敗，咖啡店股票標籤的行情數據這次沒有更新。
            門店頁面仍顯示上一份數據（不會被清空）。

            日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            具體原因和處理步驟見倉庫裡標題為「Fetch Quotes 工作流失敗」的告警 issue。
            （此郵件由 GitHub Actions 自動發送）
        run: python3 scripts/send_alert_email.py

      - name: Close failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          EXISTING=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" -R "$REPO" --comment "✅ 已自動恢復 — [Run #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})"
          fi
