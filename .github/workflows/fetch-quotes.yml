name: Fetch Quotes

on:
  # GitHub 排程任務無 SLA，實測穩定延遲 ~2 小時（07:30 HKT 計劃 → 09:30 HKT 才跑）。
  # 為了讓門店 07:30 開門前能拿到當天數據，把計劃時間提前 2 小時：
  #   主排程 21:30 UTC = 05:30 HKT 計劃 → 實際 ~07:30 HKT 落地
  #   備援 22:30 UTC = 06:30 HKT 計劃 → 實際 ~08:30 HKT（主排程被跳過時兜底）
  # 同一份 quotes.json 被多次刷新沒問題：commit step 的 git diff 自動 no-op。
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # API Key 認證（用戶中心的 App Key / App Secret / Access Token，純字符串，
      # 90 天有效）。取代舊的 longbridge CLI + 瀏覽器 OAuth + 加密 token 輪換 ——
      # 那套每 ~2 週就因 token 解密/刷新失敗而掛。
      LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
      LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
      LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
      # 關掉 SDK 啟動時打印的行情包橫幅，否則會污染 quotes.json（stdout 重定向）
      LONGBRIDGE_PRINT_QUOTE_PACKAGES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Longbridge SDK
        run: pip install --quiet longbridge

      - name: Build quotes.json
        run: |
          if [ -z "$LONGBRIDGE_APP_KEY" ] || [ -z "$LONGBRIDGE_ACCESS_TOKEN" ]; then
            echo "::error::Missing LONGBRIDGE_APP_KEY / LONGBRIDGE_APP_SECRET / LONGBRIDGE_ACCESS_TOKEN secret"
            exit 1
          fi
          python3 scripts/build_quotes.py > quotes.json
          COUNT=$(python3 -c 'import json,sys; print(json.load(open("quotes.json"))["count"])')
          echo "::notice::Fetched $COUNT symbols"

      # 自動續期：access token 是 90 天 JWT。剩餘 <30 天時自動換新（再 90 天），
      # 新 token 直接寫回 Secret（純字符串、無損，舊機制的二進制/解密問題不復存在）。
      # ROTATE_PAT 未配時只是不續期；token 還有幾十天，到期會由告警提醒人工更新。
      - name: Refresh access token if near expiry
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
          REPO: ${{ github.repository }}
          REFRESH_THRESHOLD_DAYS: '30'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ROTATE_PAT 未配置 — 跳過自動續期"
            exit 0
          fi
          STATUS=$(python3 scripts/refresh_token_if_needed.py /tmp/new_token)
          echo "refresh status: $STATUS"
          if [ "$STATUS" = "REFRESHED" ]; then
            gh secret set LONGBRIDGE_ACCESS_TOKEN -R "$REPO" < /tmp/new_token
            rm -f /tmp/new_token
            echo "✓ Access token 已續期並寫回 Secret（再 90 天）"
          fi

      - name: Commit quotes.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes in quotes.json"
          else
            git commit -m "chore(data): refresh quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 失敗告警：開/更新一個 auto-alert issue（@清汤，觸發郵件），成功時自動關閉。
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          BODY="**Run #${RUN_ID} 失敗** — [查看日志](${RUN_URL})

          咖啡店股票標籤的行情數據沒拉到。連續失敗會導致標籤顯示舊數據。

          ---

          現在用 **API Key 認證**（90 天 token + 自動續期）。可能原因：
          - Access token 已過期且自動續期沒跑成功 → 去用戶中心重新生成 Access Token，更新 \`LONGBRIDGE_ACCESS_TOKEN\` secret
          - 長橋 API 故障 / 行情權限變動

          手動更新 token：
          \`\`\`bash
          gh secret set LONGBRIDGE_ACCESS_TOKEN -R ${REPO} --body '<用戶中心的新 Access Token>'
          gh workflow run \"Fetch Quotes\" -R ${REPO}
          \`\`\`

          修好後此 issue 會在下次成功運行時自動關閉。"
          EXISTING=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "$BODY"
          else
            gh label create "auto-alert" -R "$REPO" --color "d73a4a" --description "Auto-created by workflows" 2>/dev/null || true
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "auto-alert" --assignee qintangzhang-cmyk
          fi

      - name: Close failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          EXISTING=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" -R "$REPO" --comment "✅ 已自動恢復 — [Run #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})"
          fi
