name: Fetch Quotes

on:
  # GitHub 排程任務無 SLA，實測穩定延遲 ~2 小時（07:30 HKT 計劃 → 09:30 HKT 才跑）。
  # 為了讓門店 07:30 開門前能拿到當天數據，把計劃時間提前 2 小時：
  #   主排程 21:30 UTC = 05:30 HKT 計劃 → 實際 ~07:30 HKT 落地
  #   備援 22:30 UTC = 06:30 HKT 計劃 → 實際 ~08:30 HKT（主排程被跳過時兜底）
  # 同一份 quotes.json 被多次刷新沒問題：commit step 的 git diff 自動 no-op。
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  # Actions 页面支持手动点 "Run workflow"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Longbridge CLI
        run: |
          curl -sSL https://github.com/longbridge/longbridge-terminal/raw/main/install | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Restore OAuth token
        env:
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
          LB_TOKEN_JSON: ${{ secrets.LONGBRIDGE_TOKEN_JSON }}
        run: |
          if [ -z "$LB_CLIENT_ID" ] || [ -z "$LB_TOKEN_JSON" ]; then
            echo "::error::Missing LONGBRIDGE_CLIENT_ID or LONGBRIDGE_TOKEN_JSON secret"
            exit 1
          fi
          mkdir -p ~/.longbridge/openapi/tokens
          printf '%s' "$LB_TOKEN_JSON" > "$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID"

      - name: Build quotes.json
        run: |
          python3 scripts/build_quotes.py > quotes.json
          COUNT=$(python3 -c 'import json; print(json.load(open("quotes.json"))["count"])')
          echo "::notice::Fetched $COUNT symbols"

      # Push the rotated refresh token back to GitHub Secret. Longbridge rotates
      # the refresh token on every use; without this step we'd be using a stale
      # token after the first run, leading to "Refresh token has expired" ~10 days later.
      # No-op (with a warning) if ROTATE_PAT isn't set, so this is safe to land before
      # the PAT is configured.
      - name: Rotate LONGBRIDGE_TOKEN_JSON secret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ROTATE_PAT not configured — skipping token rotation. Manual re-auth needed when token expires (~10-90 days)."
            exit 0
          fi
          # Debug: where did longbridge CLI actually store the token?
          echo "--- DEBUG: token search ---"
          echo "HOME=$HOME"
          echo "LB_CLIENT_ID length: ${#LB_CLIENT_ID}"
          echo "Files under ~/.longbridge:"
          find "$HOME/.longbridge" -type f 2>/dev/null | head -20 || echo "  (~/.longbridge missing)"
          echo "Files under ~/.config (longbridge*):"
          find "$HOME/.config" -type d -name "*longbridge*" 2>/dev/null | head -5
          echo "Token-shaped JSON files under HOME:"
          find "$HOME" -maxdepth 6 -type f -name "$LB_CLIENT_ID" 2>/dev/null | head -5
          echo "--- end debug ---"

          TOKEN_FILE="$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID"
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "::warning::Token file missing at $TOKEN_FILE — nothing to rotate"
            exit 0
          fi
          echo "Pushing refreshed token ($(wc -c < "$TOKEN_FILE") bytes) back to GitHub Secret"
          gh secret set LONGBRIDGE_TOKEN_JSON -R "$REPO" < "$TOKEN_FILE"
          echo "✓ LONGBRIDGE_TOKEN_JSON secret updated"

      - name: Commit quotes.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes in quotes.json"
          else
            git commit -m "chore(data): refresh quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Failure alerting via GitHub Issue:
      # - On failure: open a canonical "Fetch Quotes failing" issue, or add a
      #   comment if one already exists. Repo owner gets notified via GitHub's
      #   normal channels (email + mobile push) for free.
      # - On next success: auto-close the issue so we don't carry old noise.
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          BODY=$(cat <<EOF
          **Run #${RUN_ID} 失敗** — [查看 GitHub Actions 日志](${RUN_URL})

          咖啡店股票標籤的行情數據沒拉到。如果連續失敗，標籤會繼續顯示舊數據。

          ---

          **最常見原因：長橋 refresh token 過期。**

          修復三步：

          \`\`\`bash
          # 1. 本地重新走 OAuth
          longbridge login

          # 2. 把新 token 推到 GitHub Secret
          gh secret set LONGBRIDGE_TOKEN_JSON \\
            -R ${REPO} \\
            < ~/.longbridge/openapi/tokens/<CLIENT_ID>

          # 3. 手動觸發一次工作流確認修好
          gh workflow run "Fetch Quotes" -R ${REPO}
          \`\`\`

          修好後此 issue 會在下次成功運行時自動關閉。
          EOF
          )
          existing=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$existing" ]; then
            echo "Updating existing alert issue #$existing"
            gh issue comment "$existing" -R "$REPO" --body "$BODY"
          else
            echo "Creating new alert issue"
            gh label create "auto-alert" -R "$REPO" --color "d73a4a" --description "Auto-created by workflows" 2>/dev/null || true
            # --assignee 觸發單獨的 "@you was assigned" 通知，比 ci_activity 等級高，
            # GitHub 默認會發郵件，不會被 Watching 設置吞掉
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "auto-alert" --assignee qintangzhang-cmyk
          fi

      - name: Close failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="🔴 Fetch Quotes 工作流失敗（自動告警）"
          existing=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [ -n "$existing" ]; then
            echo "Closing recovered issue #$existing"
            gh issue close "$existing" -R "$REPO" --comment "✅ 已自動恢復 — [Run #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})"
          fi
