name: Fetch Quotes

on:
  # HKT 07:30 = UTC 23:30 前一天
  schedule:
    - cron: '30 23 * * *'
  # Actions 页面支持手动点 "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Longbridge CLI
        run: |
          curl -sSL https://github.com/longbridge/longbridge-terminal/raw/main/install | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Restore OAuth token
        env:
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
          LB_TOKEN_JSON: ${{ secrets.LONGBRIDGE_TOKEN_JSON }}
        run: |
          if [ -z "$LB_CLIENT_ID" ] || [ -z "$LB_TOKEN_JSON" ]; then
            echo "::error::Missing LONGBRIDGE_CLIENT_ID or LONGBRIDGE_TOKEN_JSON secret"
            exit 1
          fi
          mkdir -p ~/.longbridge/openapi/tokens
          printf '%s' "$LB_TOKEN_JSON" > "$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID"

      - name: Build quotes.json
        run: |
          python3 scripts/build_quotes.py > quotes.json
          echo "::notice::Fetched $(python3 -c 'import json; print(json.load(open(\"quotes.json\"))[\"count\"])') symbols"

      - name: Persist refreshed token (in case CLI refreshed it)
        env:
          LB_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
        run: |
          # After CLI usage, token file may have been auto-refreshed.
          # We DO NOT commit it to the repo. Instead we echo a hint if it changed
          # (manual Secret update will be needed ~every 90 days).
          if [ -f "$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID" ]; then
            echo "Token file size: $(wc -c < "$HOME/.longbridge/openapi/tokens/$LB_CLIENT_ID") bytes"
          fi

      - name: Commit quotes.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json
          if git diff --cached --quiet; then
            echo "No changes in quotes.json"
          else
            git commit -m "chore(data): refresh quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Send a Slack alert if any earlier step failed. No-op if SLACK_WEBHOOK_URL
      # is unset, so this is safe to land before the secret is configured.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification"
            exit 0
          fi
          MSG=$(jq -n --arg url "$RUN_URL" --arg repo "$REPO" '{
            text: ("🔴 *Stock Label · Fetch Quotes 失敗*\n咖啡店股票標籤的行情數據沒拉到（連續失敗會導致標籤顯示舊數據）。\n• Run: <" + $url + "|查看 GitHub Actions 日志>\n• 最常見原因：長橋 refresh token 過期。修復步驟：\n  1. 本地: `longbridge login`\n  2. `gh secret set LONGBRIDGE_TOKEN_JSON -R " + $repo + " < ~/.longbridge/openapi/tokens/<CLIENT_ID>`\n  3. `gh workflow run \"Fetch Quotes\" -R " + $repo + "`")
          }')
          curl -sS -X POST -H 'Content-type: application/json' --data "$MSG" "$SLACK_WEBHOOK_URL"
