name: Data Watchdog

# 看門狗：檢查門店實際讀到的 quotes.json（GitHub Pages 上那份）是否已經是
# 「最近一次美股收市之後」生成的。過期就觸發 Fetch Quotes（force），等它跑完、
# 等 Pages 部署完再復查；仍過期才開/更新告警 issue（@清汤）。
# 判斷用的是和抓取同一套收市時鐘（scripts/market_clock.py），週末、夏令時
# 切換都不會誤報。全程跑在 GitHub 雲端，不需要任何人的電腦開機。
#
# 能自動修：排隊延遲、偶發失敗、Pages 部署沒跟上。
# 不能自動修：長橋 token 被作廢 —— 那種 Fetch Quotes 自己會開告警 issue 寫明原因。

on:
  schedule:
    # 收市後 ~1–2 小時起查（冬令時收市 = 21:15 UTC），GitHub 排程本身也會晚到，
    # 多排兩次兜底：22:07 / 23:07 / 01:07 UTC = 06:07 / 07:07 / 09:07 HKT（計劃時間）。
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 觸發 Fetch Quotes workflow
  pages: write     # main 上已是新數據、只是網頁沒更新時，重新部署 Pages
  issues: write    # 開告警 issue

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check freshness, retry, and alert
        run: |
          set -uo pipefail

          # Slack 只在三種時候發，避免刷屏：新開告警（且 Fetch Quotes 沒有先報過）、
          # 每天開店前一次「仍未恢復」提醒、恢復時（只對發過 Slack 的告警）。
          # 發過 Slack 的告警在 issue 裡留 slack-notified 標記。
          MARK="<!-- slack-notified -->"
          queue_slack() { printf '%s\n' "$@" > "$RUNNER_TEMP/slack.txt"; }

          close_open_issue() {
            local n
            n=$(gh issue list -R "$REPO" --state open --label "watchdog" --json number --jq '.[0].number // empty')
            [ -z "$n" ] && return 0
            gh issue close "$n" -R "$REPO" --comment "$1" || true
            if gh issue view "$n" -R "$REPO" --json body,comments --jq '[.body, .comments[].body] | join(" ")' | grep -q "slack-notified"; then
              queue_slack "✅ 股票贴纸：门店页面的行情已恢复（<https://github.com/${REPO}/issues/${n}|告警记录>）"
            fi
          }

          if MSG=$(python3 scripts/check_freshness.py); then
            echo "✓ $MSG"
            close_open_issue "✅ 數據已恢復新鮮 — 看門狗自動關閉。（$MSG）"
            exit 0
          fi
          echo "⚠ $MSG"

          # main 上那份已經是新的 → 只是網頁（Pages）沒更新：重新部署即可，
          # 不要重抓——重抓會用此刻的行情覆蓋掉清晨那份好數據。
          RID=""; CONCLUSION="pages"
          if gh api "repos/${REPO}/contents/quotes.json?ref=main" -H "Accept: application/vnd.github.raw" \
               > "$RUNNER_TEMP/main.json" 2>/dev/null \
             && MAIN_MSG=$(python3 scripts/check_freshness.py --file "$RUNNER_TEMP/main.json"); then
            echo "main 上已是新數據（$MAIN_MSG），只重新部署 Pages"
            gh api -X POST "repos/${REPO}/pages/builds" >/dev/null || echo "::warning::Pages 重新部署請求失敗"
          else
            # 已有一次 Fetch Quotes 在排隊或在跑，就等它，不再重複觸發。不帶 force：
            # main 那份過期時，抓取本來就會執行。
            RID=$(gh run list -R "$REPO" --workflow=fetch-quotes.yml --limit 10 --json databaseId,status \
                  --jq '[.[] | select(.status != "completed")][0].databaseId // empty')
            if [ -n "$RID" ]; then
              echo "已有 Fetch Quotes run $RID 未完成，等它跑完"
            else
              echo "觸發 Fetch Quotes..."
              gh workflow run fetch-quotes.yml -R "$REPO"
              sleep 20
              RID=$(gh run list -R "$REPO" --workflow=fetch-quotes.yml --event workflow_dispatch --limit 1 \
                    --json databaseId --jq '.[0].databaseId')
              echo "觸發的 run: $RID"
            fi
            for i in $(seq 1 40); do
              STATUS=$(gh run view "$RID" -R "$REPO" --json status --jq '.status')
              [ "$STATUS" = "completed" ] && break
              sleep 30
            done
            CONCLUSION=$(gh run view "$RID" -R "$REPO" --json conclusion --jq '.conclusion // "unknown"')
            echo "run $RID 結果: $CONCLUSION"
          fi

          # Pages 部署通常 1–2 分鐘內完成；最多再等 8 分鐘。
          for i in $(seq 1 16); do
            if MSG=$(python3 scripts/check_freshness.py); then
              echo "✓ $MSG"
              close_open_issue "✅ 看門狗補抓後數據已恢復。（$MSG）"
              exit 0
            fi
            sleep 30
          done

          echo "::error::補抓後數據仍過期：$MSG"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RID:-$GITHUB_RUN_ID}"
          if [ "$CONCLUSION" = "pages" ]; then
            SHORT="数据本身是新的，但网页那份没刷新（GitHub Pages 部署卡住），重新部署也没成功，到 Actions 里看「pages build and deployment」。"
            WHY="main 上的 quotes.json 已是新數據，但門店讀到的那份（GitHub Pages）沒有更新，看門狗請求重新部署後仍未生效。到倉庫 Actions 頁看「pages build and deployment」最近一次是否失敗，失敗就點 Re-run。"
          elif [ "$CONCLUSION" = "success" ]; then
            SHORT="补抓成功了，但网页那份没刷新（GitHub Pages 部署卡住），到 Actions 里重跑「pages build and deployment」。"
            WHY="補抓的 run 成功了，但門店讀到的那份（GitHub Pages）還沒更新 —— 多半是 Pages 部署卡住或失敗。到倉庫的 Actions 頁看「pages build and deployment」最近一次是否失敗，失敗就點 Re-run。"
          else
            SHORT="补抓也失败了，原因看 Fetch Quotes 的告警。"
            WHY="補抓的 run 也失敗了（結果：\`${CONCLUSION}\`）。具體原因和處理步驟見標題為「Fetch Quotes 工作流失敗」的告警 issue（例如長橋 token 被作廢）。"
          fi
          TITLE="🔴 數據看門狗：quotes.json 過期未恢復"
          BODY="看門狗檢測到門店頁面讀到的 quotes.json 仍是舊數據，自動補抓後**仍未恢復**。

          - 檢測結果：${MSG}
          - 處理記錄：[查看](${RUN_URL})

          **判斷**：${WHY}

          > 門店頁面在此期間仍顯示上一份數據，不會被清空。數據恢復後此 issue 會自動關閉。"

          EXISTING=$(gh issue list -R "$REPO" --state open --label "watchdog" --json number,createdAt \
                     --jq '.[0] | select(.) | "\(.number) \(.createdAt)"')
          if [ -n "$EXISTING" ]; then
            N=${EXISTING%% *}; SINCE=${EXISTING#* }
            AGE_H=$(( ($(date -u +%s) - $(date -u -d "$SINCE" +%s)) / 3600 ))
            # 每天開店前那一輪（07:07 HKT 計劃）提醒一次；告警剛開不到 12 小時就不重複提醒。
            if [ "$EVENT_SCHEDULE" = "7 23 * * *" ] && [ "$AGE_H" -ge 12 ]; then
              BODY="${BODY}
          ${MARK}"
              queue_slack "🔴 *股票贴纸：行情已经 ${AGE_H} 小时没恢复*，门店页面还是旧数据。" "${SHORT}" \
                "<https://github.com/${REPO}/issues/${N}|告警详情>"
            fi
            gh issue comment "$N" -R "$REPO" --body "$BODY"
          else
            # Fetch Quotes 已經為同一次故障發過 Slack 的話，這裡只開 issue 不重複發。
            FETCH_OPEN=$(gh issue list -R "$REPO" --state open --label "auto-alert" --json number --jq 'length')
            if [ "$FETCH_OPEN" = "0" ]; then
              BODY="${BODY}
          ${MARK}"
            fi
            gh label create "watchdog" -R "$REPO" --color "b60205" --description "Data freshness watchdog" 2>/dev/null || true
            ISSUE_URL=$(gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "watchdog" --assignee qintangzhang-cmyk)
            if [ "$FETCH_OPEN" = "0" ]; then
              queue_slack "🔴 *股票贴纸：门店页面还是旧数据*，自动补抓后仍未恢复。" "${SHORT}" "<${ISSUE_URL}|告警详情>"
            fi
          fi
          exit 1

      # 看門狗判定數據過期且補抓無效時，同步發郵件給外部相關人（盡力而為，失敗不影響告警）。
      - name: Email alert when data stays stale
        if: failure()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAILS: 'cody.fung@longbridge.hk,timmy@chcatcreative.com'
          ALERT_SUBJECT: '🔴 咖啡店股票標籤：數據過期未恢復（看門狗）'
          ALERT_BODY: |
            數據看門狗檢測到門店頁面讀到的 quotes.json 仍是舊數據，自動補抓後仍未恢復。
            cafe 標籤頁在此期間顯示上一份數據。

            日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            具體原因見倉庫裡標題為「數據看門狗」的告警 issue。
            （此郵件由 GitHub Actions 自動發送）
        run: python3 scripts/send_alert_email.py

      # Sends whatever the step above queued (alert, daily reminder or recovery).
      # Best-effort: without the SLACK_WEBHOOK_URL secret it just skips.
      - name: Slack alert
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION: ${{ vars.SLACK_MENTION }}
        run: |
          if [ -s "$RUNNER_TEMP/slack.txt" ]; then
            python3 scripts/send_slack_alert.py "$RUNNER_TEMP/slack.txt"
          fi
