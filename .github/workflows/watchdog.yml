name: Data Watchdog

# 看門狗：檢查門店實際讀到的 quotes.json（GitHub Pages 上那份）是否已經是
# 「最近一次美股收市之後」生成的。過期就觸發 Fetch Quotes（force），等它跑完、
# 等 Pages 部署完再復查；仍過期才開/更新告警 issue（@清汤）。
# 判斷用的是和抓取同一套收市時鐘（scripts/market_clock.py），週末、夏令時
# 切換都不會誤報。全程跑在 GitHub 雲端，不需要任何人的電腦開機。
#
# 能自動修：排隊延遲、偶發失敗、Pages 部署沒跟上。
# 不能自動修：長橋 token 被作廢 —— 那種 Fetch Quotes 自己會開告警 issue 寫明原因。

on:
  schedule:
    # 收市後 ~1–2 小時起查（冬令時收市 = 21:15 UTC），GitHub 排程本身也會晚到，
    # 多排兩次兜底：22:07 / 23:07 / 01:07 UTC = 06:07 / 07:07 / 09:07 HKT（計劃時間）。
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 觸發 Fetch Quotes workflow
  issues: write    # 開告警 issue

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check freshness, retry, and alert
        run: |
          set -uo pipefail

          close_open_issue() {
            local n
            n=$(gh issue list -R "$REPO" --state open --label "watchdog" --json number --jq '.[0].number // empty')
            [ -n "$n" ] && gh issue close "$n" -R "$REPO" --comment "$1" || true
          }

          if MSG=$(python3 scripts/check_freshness.py); then
            echo "✓ $MSG"
            close_open_issue "✅ 數據已恢復新鮮 — 看門狗自動關閉。（$MSG）"
            exit 0
          fi
          echo "⚠ $MSG"

          # 已有一次 Fetch Quotes 在排隊或在跑，就等它，不再重複觸發。
          RID=$(gh run list -R "$REPO" --workflow=fetch-quotes.yml --limit 10 --json databaseId,status \
                --jq '[.[] | select(.status != "completed")][0].databaseId // empty')
          if [ -n "$RID" ]; then
            echo "已有 Fetch Quotes run $RID 未完成，等它跑完"
          else
            echo "觸發 Fetch Quotes（force）..."
            gh workflow run fetch-quotes.yml -R "$REPO" -f force=true
            sleep 20
            RID=$(gh run list -R "$REPO" --workflow=fetch-quotes.yml --event workflow_dispatch --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
            echo "觸發的 run: $RID"
          fi
          for i in $(seq 1 40); do
            STATUS=$(gh run view "$RID" -R "$REPO" --json status --jq '.status')
            [ "$STATUS" = "completed" ] && break
            sleep 30
          done
          CONCLUSION=$(gh run view "$RID" -R "$REPO" --json conclusion --jq '.conclusion // "unknown"')
          echo "run $RID 結果: $CONCLUSION"

          # Pages 部署通常 1 分鐘內完成；最多再等 5 分鐘。
          for i in $(seq 1 10); do
            if MSG=$(python3 scripts/check_freshness.py); then
              echo "✓ $MSG"
              close_open_issue "✅ 看門狗補抓後數據已恢復。（$MSG）"
              exit 0
            fi
            sleep 30
          done

          echo "::error::補抓後數據仍過期：$MSG"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RID}"
          if [ "$CONCLUSION" = "success" ]; then
            WHY="補抓的 run 成功了，但門店讀到的那份（GitHub Pages）還沒更新 —— 多半是 Pages 部署卡住或失敗。到倉庫的 Actions 頁看「pages build and deployment」最近一次是否失敗，失敗就點 Re-run。"
          else
            WHY="補抓的 run 也失敗了（結果：\`${CONCLUSION}\`）。具體原因和處理步驟見標題為「Fetch Quotes 工作流失敗」的告警 issue（例如長橋 token 被作廢）。"
          fi
          TITLE="🔴 數據看門狗：quotes.json 過期未恢復"
          BODY="看門狗檢測到門店頁面讀到的 quotes.json 仍是舊數據，自動補抓後**仍未恢復**。

          - 檢測結果：${MSG}
          - 補抓的 run：[#${RID}](${RUN_URL})

          **判斷**：${WHY}

          > 門店頁面在此期間仍顯示上一份數據，不會被清空。數據恢復後此 issue 會自動關閉。"

          EXISTING=$(gh issue list -R "$REPO" --state open --label "watchdog" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "$BODY"
          else
            gh label create "watchdog" -R "$REPO" --color "b60205" --description "Data freshness watchdog" 2>/dev/null || true
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label "watchdog" --assignee qintangzhang-cmyk
          fi
          exit 1

      # 看門狗判定數據過期且補抓無效時，同步發郵件給外部相關人（盡力而為，失敗不影響告警）。
      - name: Email alert when data stays stale
        if: failure()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAILS: 'cody.fung@longbridge.hk,timmy@chcatcreative.com'
          ALERT_SUBJECT: '🔴 咖啡店股票標籤：數據過期未恢復（看門狗）'
          ALERT_BODY: |
            數據看門狗檢測到門店頁面讀到的 quotes.json 仍是舊數據，自動補抓後仍未恢復。
            cafe 標籤頁在此期間顯示上一份數據。

            日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            具體原因見倉庫裡標題為「數據看門狗」的告警 issue。
            （此郵件由 GitHub Actions 自動發送）
        run: python3 scripts/send_alert_email.py
